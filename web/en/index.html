<!doctype html>
<!-- SITE em inglês (T-147, SPEC-025 §Escopo — Site por URL): mesma landing institucional do
     `index.html` da raiz, mesmo bundle (`/src/entries/site.tsx`) — só o `lang` estático muda,
     e é ele que o `SiteApp` lê para decidir o locale (não `navigator.language`: o site é
     indexado por URL, a preferência do navegador é regra do `/app/`, não desta página). -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#05070d" />
    <title>Digital Fit — Train smarter. Keep evolving.</title>
    <meta
      name="description"
      content="Digital Fit uses computer vision to analyze your movements in real time, count your reps, and correct your form."
    />
    <!-- Fontes da SPEC-014 (Manrope UI / Space Grotesk números). Sem rede (compose offline)
         o fallback system-ui assume — degradação aceita e anotada na spec. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/entries/site.tsx"></script>
  </body>
</html>
