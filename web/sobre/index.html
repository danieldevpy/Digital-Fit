<!doctype html>
<!-- SITE — Sobre, em pt-BR (T-158, SPEC-026 §Escopo). Documento próprio, e não mais o
     fragmento `#/sobre`: fragmento não viaja no pedido HTTP, então o buscador via `/` e
     `/#/sobre` como a mesma página. O `lang` estático é o que o `SiteApp` lê para decidir
     o locale — site por URL, app por preferência (SPEC-025 §Escopo).

     Titulo e descricao sao GERADOS pelo `scripts/prerender.mjs`, a partir de
     `src/site/routes.ts` e do dicionario (`site:meta.about.*`). Os valores escritos abaixo sao
     apenas o que sobra se o pre-render nao rodar.

     Nao escreva nome de tag entre sinais de menor/maior em comentario deste arquivo. A
     injecao do pre-render acha a primeira ocorrencia, e foi exatamente assim que esta pagina
     perdeu a tag de abertura do documento e do cabecalho uma vez: o casamento comecou dentro
     do comentario e correu ate o cabecalho. O regex ficou mais estreito e o script passou a
     conferir a moldura depois de injetar, mas a regra aqui continua valendo, porque e a
     barata. -->
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#05070d" />
    <title>Sobre o Digital Fit — visão computacional para treinar melhor</title>
    <meta name="description" content="Privacidade em primeiro lugar, treinos para todos os níveis e evolução constante: o que o Digital Fit é e como ele analisa seu movimento." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/entries/site.tsx"></script>
  </body>
</html>
