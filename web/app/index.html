<!doctype html>
<!-- APP (T-067): o funil de treino. A landing institucional é o `index.html` da raiz.
     Servido em `/app/` hoje; em `app.dominio.com` quando o DNS quiser. -->
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#05070d" />
    <title>Digital Fit — Treino</title>
    <!-- `noindex`: o app é uma ferramenta, não conteúdo. Quem chega pela busca deve cair no
         site, que explica o produto antes de pedir a câmera. -->
    <meta name="robots" content="noindex" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/entries/app.tsx"></script>
  </body>
</html>
