# Catálogo de feedback — pt-BR (SPEC-008, Fase Inicial).
#
# O código é o contrato (`workers/shared/events.py`); a mensagem é texto e vive aqui, para
# ajustar palavra sem deploy de código. Um arquivo por idioma: `catalog.<locale>.yaml`.
#
# priority: menor vence. Cena (o dado está ruim) antes de execução (o movimento está ruim),
# porque corrigir enquadramento é pré-requisito para qualquer crítica de execução.
# severity: `info` orienta, `warning` atrapalha a medição.

OUT_OF_FRAME:
  message: Apareça inteiro no quadro
  hint: Afaste-se até ombros e tornozelos aparecerem
  severity: warning
  priority: 10

TOO_FAR:
  message: Aproxime-se da câmera
  hint: Seu corpo deve ocupar mais da metade da altura da tela
  severity: warning
  priority: 11

TOO_CLOSE:
  message: Afaste-se da câmera
  hint: Recue até aparecer da cabeça aos pés
  severity: warning
  priority: 11

ARMS_TOO_LOW:
  message: Estenda mais os braços acima da cabeça
  hint: As mãos devem passar da linha dos ombros
  severity: info
  priority: 20

LEGS_TOO_CLOSED:
  message: Abra mais as pernas
  hint: Os pés devem passar da largura dos ombros
  severity: info
  priority: 21

SQUAT_TOO_SHALLOW:
  message: Desça mais no agachamento
  hint: Baixe até a coxa ficar paralela ao chão
  severity: info
  priority: 22

PUSHUP_TOO_SHALLOW:
  message: Desça mais na flexão
  hint: Dobre o cotovelo até uns 90°, com o peito perto do chão
  severity: info
  priority: 23

# Quadril fora da linha é a crítica que separa flexão de flexão bem feita, e vem antes das de
# amplitude: quem está com a lombar cedendo precisa ouvir isso antes de "desça mais".
HIPS_SAGGING:
  message: Contraia o abdômen
  hint: O quadril está caindo — mantenha o corpo numa linha reta da cabeça aos pés
  severity: info
  priority: 20

HIPS_PIKED:
  message: Abaixe o quadril
  hint: O quadril está empinado — alinhe o corpo da cabeça aos pés
  severity: info
  priority: 20

CRUNCH_TOO_SHALLOW:
  message: Suba um pouco mais
  hint: Tire as escápulas do chão, sem descolar a lombar
  severity: info
  priority: 23

CRUNCH_TOO_FAST:
  message: Mais devagar
  hint: Subir no impulso usa o quadril; suba contando dois tempos
  severity: info
  priority: 21
