# nginx INTERNO do container do web — serve o build do Vite e nada mais.
# TLS, dominio e roteamento de /api e /ws sao do nginx da VPS (docs/DEPLOY.md).

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # `application/wasm` importa: o runtime do MediaPipe e instanciado por streaming, e com
    # o MIME errado o navegador recusa o modulo — a camera abre e a pose nunca carrega.
    types {
        application/wasm wasm;
    }
    include /etc/nginx/mime.types;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
    # .wasm e .task ja sao comprimidos/binarios: gzipar de novo so gasta CPU.

    # Assets com hash no nome podem ser cacheados para sempre.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # O modelo (5,5 MB) e o wasm nao tem hash no nome: cache curto, revalidando.
    location ~ ^/(models|wasm)/ {
        expires 1h;
        add_header Cache-Control "public";
    }

    # Dois SPAs no mesmo artefato (T-067): o SITE na raiz, o APP em /app/. A ordem importa —
    # sem este bloco, um reload em /app/qualquer-coisa cairia no index do SITE, e a pessoa
    # veria a landing no lugar do treino.
    location /app/ {
        try_files $uri $uri/ /app/index.html;
    }

    # SPA: qualquer rota desconhecida devolve o index do site.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Os dois index NUNCA sao cacheados: sao eles que apontam para os assets com hash novo.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location = /app/index.html {
        add_header Cache-Control "no-cache";
    }
}
