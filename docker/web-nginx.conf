# nginx INTERNO do container do web — serve o build do Vite e nada mais.
# TLS, dominio e roteamento de /api e /ws sao do nginx da VPS (docs/DEPLOY.md).

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # `application/wasm` importa: o runtime do MediaPipe e instanciado por streaming, e com o
    # MIME errado o navegador recusa o modulo — a camera abre e a pose nunca carrega. Vem do
    # mime.types do proprio nginx (linha 55 na 1.27), entao nao ha bloco `types` proprio aqui:
    # declarar de novo so produziria aviso de extensao duplicada no log.
    include /etc/nginx/mime.types;

    # ---------------------------------------------------------------------------------
    # Compressao (T-070)
    # ---------------------------------------------------------------------------------
    # O comentario anterior dizia que `.wasm` "ja e binario comprimido" e o deixava de fora.
    # Medido: 11,0 MB -> 3,2 MB. Era falso, e custava 7,8 MB a cada primeiro acesso — em 4G, a
    # diferenca entre esperar 10s e esperar 30s antes de poder treinar.
    #
    # `gzip_static on` vem primeiro de proposito: se existir `arquivo.gz` ao lado do arquivo,
    # nginx serve o pronto e nao gasta CPU nenhuma. Comprimir 11 MB a cada requisicao seria
    # trocar banda por CPU numa VPS de 4 vCPU que tambem roda dois pose-workers.
    #
    # O `gzip on` abaixo e a rede de seguranca: sem os `.gz` gerados no build, ainda comprime
    # na hora. Os dois juntos garantem que o cliente sempre recebe comprimido, com ou sem o
    # passo de build (ver `scripts/setup-mediapipe.mjs`).
    gzip_static on;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/wasm;
    gzip_min_length 1024;
    gzip_comp_level 6;

    # ESTAS DUAS LINHAS SAO O QUE FAZ A COMPRESSAO EXISTIR EM PRODUCAO.
    #
    # `gzip_http_version` vale 1.1 por default, e `proxy_pass` fala HTTP/1.0 com o upstream por
    # default. Ou seja: por tras do nginx da VPS, este nginx RECUSAVA comprimir tudo — nao so o
    # wasm, tambem o CSS e o JS que a config anterior achava que estava comprimindo. Medido: no
    # HTTP/1.1 direto saem 3,2 MB; no HTTP/1.0 do proxy saiam 11.532.084 bytes, o mesmo numero
    # que aparecia no waterfall do celular.
    #
    # `gzip_proxied any` cobre o caso vizinho: com `off` (o default), nginx nao comprime
    # requisicao que chega com cabecalho `Via` — que e o que aparece no dia em que um CDN ou um
    # segundo proxy entrar na frente. Silencioso, e do mesmo tipo do bug acima.
    gzip_http_version 1.0;
    gzip_proxied any;

    # Com proxy no meio, a resposta comprimida precisa se anunciar como variante: sem `Vary`,
    # um cache intermediario pode entregar corpo gzipado a um cliente que nao pediu.
    gzip_vary on;
    # `.task` fica FORA: o modelo e float16 e comprime pouco (5,5 -> 4,7 MB), o que nao paga a
    # CPU por requisicao. Ele nao tem MIME proprio, entao ficar fora e o comportamento natural.

    # Assets com hash no nome podem ser cacheados para sempre.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # O modelo (5,5 MB) e o wasm nao tem hash no nome: cache curto, revalidando.
    location ~ ^/(models|wasm)/ {
        expires 1h;
        add_header Cache-Control "public";
    }

    # O APP continua sendo um SPA de fragmento (`#/preparar`) e mantem o fallback: e `noindex`
    # por decisao de produto (SPEC-026), ninguem o rastreia, e um reload em /app/qualquer-coisa
    # tem de cair no index do treino e nao na landing.
    location /app/ {
        try_files $uri $uri/ /app/index.html;
    }

    # O SITE nao e mais fallback (T-158, SPEC-026). Cada rota tem arquivo proprio no build
    # (`vite.config.ts`), entao caminho que nao existe devolve 404 DE VERDADE.
    #
    # O `try_files ... /index.html` que estava aqui devolvia **200 com a landing em portugues**
    # para qualquer URL errada — o *soft 404*, que o Google trata como sinal de site de baixa
    # qualidade. Custava pouco enquanto nao havia URL para errar; com paginas por exercicio
    # (T-165) custaria caro, e o erro nao aparece em log nenhum: e uma pagina que responde OK.
    location / {
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;

    # `internal`: a 404 e uma RESPOSTA, nao uma pagina. Sem isto ela teria URL propria e o
    # buscador poderia indexa-la com status 200 — o soft 404 voltando pela porta dos fundos.
    location = /404.html {
        internal;
        add_header Cache-Control "no-cache";
    }

    # Nenhum index.html e cacheado: sao eles que apontam para os assets com hash novo.
    #
    # Regex, e nao um `location =` por arquivo (T-158): eram dois quando havia dois entries, e
    # `/en/index.html` — o terceiro, criado pela T-147 — ficou de fora sem ninguem notar,
    # sujeito ao cache heuristico do navegador justamente no arquivo que aponta para os assets
    # novos. Com seis entries a lista escrita a mao erraria de novo. A regex vence o prefixo
    # `location /` na ordem do nginx, e cobre o redirecionamento interno do `try_files` do app.
    location ~ /index\.html$ {
        add_header Cache-Control "no-cache";
    }
}
