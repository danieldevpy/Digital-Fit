# Corpus de avaliação (SPEC-012 / T-038).
#
# Os vídeos NÃO são versionados (ver .gitignore) — só este manifest é. Quem clonar o
# repositório precisa das gravações para rodar `evalctl run eval/corpus/`.
#
# `expected_reps` é o rótulo humano: a contagem que uma pessoa fez assistindo. É contra ele
# que a acurácia é medida, então errar aqui envenena toda a bancada.
#
# Os nomes dos campos em `conditions` são livres, mas devem ser CONSISTENTES entre vídeos: o
# relatório agrupa por eles ("por angulo", "por cadencia") e é assim que se descobre em qual
# condição o pipeline erra. Ver README.md.

- file: polichinelo-01.mp4
  exercise: jumping_jack
  expected_reps: 20
  conditions:
    orientacao: paisagem
    resolucao: 854x480
    angulo: frontal
    enquadramento: corpo inteiro
    # Os 2s parados sao o que o produto sempre tem (countdown): por isso este video mede
    # o pipeline real, e os outros dois nao.
    inicio: ~2s parados antes de comecar (countdown natural)
    cadencia: media

- file: polichinelo-02.mp4
  exercise: jumping_jack
  expected_reps: 15
  conditions:
    orientacao: retrato
    resolucao: 576x1024
    angulo: frontal
    enquadramento: corpo inteiro
    inicio: exercicio comeca imediatamente
    # 15 reps em 12,2s ≈ 73 rpm, a mais rápida do corpus. Cadência alta é justamente onde a
    # decimação para 10fps do modo cloud tem mais chance de perder o pico do movimento.
    cadencia: rapida
    # Com `--no-calibrate` a bancada agora conta 15/15 (era 14): a T-047 fez a FSM ler a fase
    # do primeiro frame em vez de nascer em CLOSED, e no ts=0 a pessoa JA esta aberta
    # (arm 143°, spread 3.19). A FSM esta exata neste video.
    # O que sobra e a calibracao: sem countdown, a SPEC-004 consome o primeiro segundo, que
    # aqui e exercicio de verdade — a 73 rpm isso custa as 2 reps que ainda faltam. Nao e
    # defeito de contagem, e o preco de medir o corpo num video que ja comeca em movimento;
    # o produto nao paga esse preco porque tem o countdown (T-049).
    conhecido: -2 com calibracao (janela de medicao cai em cima do exercicio); 0 sem

- file: polichinelo-03.mp4
  exercise: jumping_jack
  expected_reps: 21
  conditions:
    orientacao: retrato
    resolucao: 576x1024
    # Plano frontal com ângulo de ~20–30° em relação à câmera, permitindo ver ao mesmo tempo
    # a abertura dos braços, a amplitude das pernas e a profundidade do movimento.
    angulo: obliquo 20-30
    enquadramento: corpo inteiro
    inicio: exercicio comeca imediatamente
    cadencia: media
    # A bancada conta 20: detecção é perfeita nos primeiros 20s e ZERO do segundo 21 ao 25 —
    # a pessoa sai do quadro e a última rep acontece onde o modelo não a vê. O ângulo oblíquo
    # não atrapalhou a contagem.
    # Sem countdown: a calibracao come o primeiro segundo (1 rep), e a ultima se perde
    # porque a pessoa sai do quadro nos ~5s finais.
    conhecido: -2 (sem countdown + sai do quadro no fim)

# Exploracao do angulo frontal para flexao (conversa 2026-08-06): as features atuais de
# flexao.py sao calibradas para perfil (celular deitado, de lado) — este video testa a
# hipotese de celular em pe, de frente. Ver DEVLOG/BACKLOG para o diagnostico.
- file: flexão-frente-50-repetições-v1.mp4
  exercise: flexao
  expected_reps: 50
  conditions:
    orientacao: retrato
    resolucao: 576x1024
    angulo: frontal
    celular: em pe no chao
    inicio: a confirmar (nao gravado com countdown parado)
    execucao: a confirmar
    # Com o porteiro atual (trunk_spread >= 1.2, calibrado para perfil) conta 0/50: de
    # frente o vetor ombro->quadril fica quase vertical na imagem (trunk_spread max
    # observado = 0.66), entao o gate nunca abre. Ver diagnostico na conversa.
    # ATENCAO: o rotulo veio do TITULO do video (rede social), nao de contagem propria — o que
    # o README desaconselha explicitamente. Ver Descoberta [A/T-108] no BACKLOG: e o que impede
    # a promocao de `flexao` a `calibrado`.
    #
    # Antes da T-108: 0/50 (o porteiro `trunk_spread >= 1.2` e de perfil e nunca abre de
    # frente — maximo observado 0.66). Depois: 52/50, com a vista detectada como `frontal` e a
    # contagem pelo angulo do cotovelo. O 52 esta num plato estavel (20 pares de limiar dao o
    # mesmo numero), entao a diferenca tanto pode ser o rotulo quanto o algoritmo.
    conhecido: 52/50 (era 0/50 antes da T-108); rotulo herdado do titulo, nao verificado

- file: flexão-frente-50-repetições-v2.mp4
  exercise: flexao
  expected_reps: 50
  conditions:
    orientacao: retrato
    resolucao: 576x1024
    angulo: frontal
    celular: em pe no chao
    inicio: a confirmar
    execucao: a confirmar
    # Mesmo rotulo herdado do titulo que o v1 (ver [A/T-108]).
    # A camera fica bem mais perto: em ~4% dos frames o modelo perde pulso/cotovelo
    # (visibilidade < 0.5), e sao esses que ainda produzem 2 avisos legitimos de
    # OUT_OF_FRAME — os unicos que sobraram depois da T-108 (eram 26).
    conhecido: 50/50 exato (era 0/50 antes da T-108); ~4% dos frames com pulso/cotovelo perdidos

# Video de internet/rede social (nao gravacao propria) — tem cortes de camera, fala e um
# angulo obliquo (nao puramente frontal nem perfil, mistura os dois). NAO tem expected_reps
# confiavel: e um compilado promocional ("E VOCE? QUANTAS CONSEGUE?"), nao uma serie continua
# — o corte no meio invalida a contagem (ver README, secao "Videos da internet servem?").
# Serve so como teste de robustez de feature (variedade de angulo/oclusao), nao para acuracia.
- file: flexão-frente&lado-v1.mp4
  exercise: flexao
  conditions:
    orientacao: retrato
    resolucao: 576x1024
    angulo: obliquo (misto frente/lado, com cortes)
    fonte: internet
    execucao: nao continua (compilado com cortes e fala)
    conhecido: sem rotulo confiavel; elbow_angle bruto conta 11 no trecho (nao validavel)
