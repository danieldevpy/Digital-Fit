# Digital Fit — producao simplista (VPS unica, atras do SEU nginx).
#
#   ./scripts/prod.sh up      # nao chame `docker compose` direto: o script deriva as
#                             # URLs publicas a partir do DOMAIN e valida os segredos.
#
# Este arquivo e AUTONOMO, nao um override do docker-compose.yml. Um override herdaria os
# bind mounts e o `runserver` do dev calados — e o dia em que isso for percebido ja e tarde.
#
# Diferencas deliberadas em relacao ao dev:
#   - redis e postgres NAO sao publicados no host (so a rede interna os alcanca)
#   - `api` sobe em gunicorn, nao em `runserver`
#   - nada de bind mount: a imagem e o artefato, o codigo do host nao vaza para dentro
#   - o `web` e build estatico servido por nginx, nao o dev server do Vite
#   - as portas ficam em 127.0.0.1 por padrao: quem expoe ao mundo e o seu nginx
#
# Nome de projeto separado do dev: volumes e rede nao se misturam se os dois rodarem
# na mesma maquina.
name: digital-fit-prod

x-django-env: &django-env
  DJANGO_DEBUG: "false"
  DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?defina no .env.prod (veja .env.prod.example) — e use ./scripts/prod.sh, nao docker compose direto}
  DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:?derivado do DOMAIN — use ./scripts/prod.sh em vez de docker compose direto}
  DJANGO_BEHIND_PROXY: "true"
  CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?derivado do DOMAIN — use ./scripts/prod.sh em vez de docker compose direto}
  SESSION_TOKEN_SECRET: ${SESSION_TOKEN_SECRET:?defina no .env.prod (veja .env.prod.example) — e use ./scripts/prod.sh, nao docker compose direto}
  # Assina os JWT das contas (SPEC-011). Separado do DJANGO_SECRET_KEY para que girar um nao
  # deslogue o mundo pelo outro; sem valor, o settings cai no DJANGO_SECRET_KEY.
  JWT_SIGNING_KEY: ${JWT_SIGNING_KEY:-}
  AUTH_THROTTLE_RATE: ${AUTH_THROTTLE_RATE:-10/min}
  GATEWAY_WS_URL: ${GATEWAY_WS_URL:?derivado do DOMAIN — use ./scripts/prod.sh em vez de docker compose direto}
  POSTGRES_HOST: postgres
  POSTGRES_DB: ${POSTGRES_DB:-digitalfit}
  POSTGRES_USER: ${POSTGRES_USER:-digitalfit}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina no .env.prod (veja .env.prod.example) — e use ./scripts/prod.sh, nao docker compose direto}
  REDIS_URL: redis://redis:6379/0
  LOG_LEVEL: ${LOG_LEVEL:-INFO}

services:
  redis:
    image: redis:7-alpine
    # `noeviction` de proposito: perder frame de sessao em silencio e pior que recusar
    # escrita ruidosamente. Sem persistencia — o barramento e efemero por design.
    command: >
      redis-server
      --maxmemory ${REDIS_MAXMEMORY:-256mb}
      --maxmemory-policy noeviction
      --save ""
      --appendonly no
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-digitalfit}
      POSTGRES_USER: ${POSTGRES_USER:-digitalfit}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina no .env.prod — e use ./scripts/prod.sh, nao docker compose direto}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-digitalfit} -d ${POSTGRES_DB:-digitalfit}"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: docker/server.Dockerfile
    # WSGI sincrono: gunicorn. O `--timeout` curto e proposital — a admissao e um POST de
    # milissegundos; se travar mais que isso, matar e melhor que empilhar requisicao.
    command: >
      gunicorn core.wsgi:application
      --bind 0.0.0.0:8000
      --workers ${API_WORKERS:-3}
      --timeout 30
      --access-logfile -
      --error-logfile -
    environment:
      <<: *django-env
      # O relay pertence ao gateway. Se subisse aqui tambem, cada evento de analise seria
      # empurrado duas vezes ao cliente.
      GATEWAY_RELAY: "0"
      # Painel de operacao (SPEC-018): DESLIGADO por padrao, e quando ligado e SO aqui — por
      # isso mora no bloco do `api` e nao no `*django-env` compartilhado. O gateway tem ainda
      # a trava de processo (`core/admin_gate.py`), que nao depende desta variavel.
      DJANGO_ENABLE_ADMIN: ${DJANGO_ENABLE_ADMIN:-0}
      # Caminho do painel. Trocar por algo so seu: `/admin` e a primeira URL que um scanner
      # tenta, e `painel/` e a segunda.
      DJANGO_ADMIN_PATH: ${DJANGO_ADMIN_PATH:-painel/}
      # Origem do painel com esquema (`https://treino.dominio`) — sem ela o POST do login
      # falha no CSRF atras do proxy que termina TLS.
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-}
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${API_PORT:-8000}:8000"
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    # O `Host` nao e detalhe: ALLOWED_HOSTS em producao e SO o DOMAIN, e um GET a
    # 127.0.0.1 sem esse header volta 400 (DisallowedHost). Medido: 127.0.0.1 -> 400,
    # dominio -> 200. Sem o header o healthcheck marca "unhealthy" uma api perfeitamente
    # viva — e o unico sinal de saude da stack passa a mentir.
    healthcheck:
      test:
        - CMD
        - python
        - -c
        # Aspas obrigatorias: sem elas o `:` de {'Host': ...} faz o YAML ler um mapa.
        - "import urllib.request as u; u.urlopen(u.Request('http://127.0.0.1:8000/healthz', headers={'Host': '${DOMAIN:?vem do .env.prod — use ./scripts/prod.sh em vez de docker compose direto}'}))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  gateway:
    build:
      context: .
      dockerfile: docker/server.Dockerfile
    # ASGI: WebSocket de ingestao + relay de `events.analysis`. O relay usa o channel layer
    # (Redis), entao mais de um worker funciona — mas cada processo abre seu proprio
    # consumidor do stream. Um so ate haver motivo medido para crescer.
    command: uvicorn core.asgi:application --host 0.0.0.0 --port 8001 --workers 1
    environment: *django-env
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${GATEWAY_PORT:-8001}:8001"
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  analysis-worker:
    build:
      context: .
      dockerfile: docker/server.Dockerfile
    working_dir: /app
    command: python -m workers.analysis_worker.main
    # NAO escale este servico. A FSM guarda estado por sessao em memoria, e o consumer
    # group do Redis distribuiria frames da MESMA sessao entre replicas — a contagem de
    # reps quebraria de um jeito que so aparece sob carga.
    deploy:
      replicas: 1
    environment:
      REDIS_URL: redis://redis:6379/0
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  report-builder:
    build:
      context: .
      dockerfile: docker/server.Dockerfile
    command: python manage.py report_builder
    # NAO escale: o nome do consumidor e estavel de proposito (o PEL do Redis e indexado por
    # ele, e e assim que as pendencias voltam depois de um restart — SPEC-010, criterio 2).
    # Duas replicas com o mesmo nome disputariam as MESMAS entregas pendentes.
    deploy:
      replicas: 1
    environment: *django-env
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    restart: unless-stopped

  dataset-writer:
    # SPEC-010: o corpus de keypoints que financia o ML futuro. Fora do hot path por
    # construcao — se este servico cair, nenhuma sessao deixa de funcionar; so para de gravar.
    build:
      context: .
      dockerfile: docker/dataset-writer.Dockerfile
    working_dir: /app
    command: python -m workers.dataset_writer.main
    # PODE escalar (o ack e imediato, nao ha PEL a recuperar), mas nao adianta: uma replica da
    # conta de 15 fps por sessao com folga, e duas dividiriam os frames de uma MESMA sessao
    # entre dois buffers — dois arquivos parciais no lugar de um inteiro.
    deploy:
      replicas: 1
    environment:
      REDIS_URL: redis://redis:6379/0
      DATASET_DIR: /data/dataset
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      # Bind mount de proposito: o corpus e o ativo que sai da VPS por rsync. Num volume
      # nomeado ele ficaria refem do Docker daquela maquina.
      - ${DATASET_DIR:-./dataset}:/data/dataset
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  pose-worker:
    build:
      context: .
      dockerfile: docker/pose-worker.Dockerfile
    working_dir: /app
    command: python -m workers.pose_worker.main
    # 2 replicas, 1 vCPU cada (SPEC-005). Diferente do analysis-worker, ESTE escala: nao ha
    # estado entre frames (RunningMode.IMAGE), entao o consumer group pode distribuir a
    # vontade. O limite de CPU e o que mantem os 4 vCPU da VPS previsiveis — sem ele, dois
    # workers de visao competiriam com o gateway pela mesma maquina.
    deploy:
      replicas: ${POSE_WORKER_REPLICAS:-2}
      resources:
        limits:
          cpus: "${POSE_WORKER_CPUS:-1.0}"
    environment:
      REDIS_URL: redis://redis:6379/0
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DIGITALFIT_POSE_MODEL: /models/pose_landmarker_lite.task
    volumes:
      - ./eval/models:/models:ro
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
      args:
        # Gravadas no bundle em build time — trocar de dominio exige rebuild, e o
        # `scripts/prod.sh up` sempre reconstroi por isso.
        VITE_API_URL: ${VITE_API_URL:?derivado do DOMAIN — use ./scripts/prod.sh em vez de docker compose direto}
        # Fronteira SITE|APP (T-067). Vazias num dominio so: o cliente usa `/` e `/app/`.
        VITE_SITE_URL: ${VITE_SITE_URL:-}
        VITE_APP_URL: ${VITE_APP_URL:-}
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${WEB_PORT:-8080}:80"
    restart: unless-stopped

volumes:
  postgres-data:
