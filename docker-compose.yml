# Digital Fit — desenvolvimento local. Tudo com um comando:
#   docker compose up
#
# Servicos desta fase: redis (barramento de eventos), postgres (dados), api (Django).
# O gateway (Channels), os workers e o `web` (Vite) entram nas suas proprias tasks.

name: digital-fit

services:
  redis:
    image: redis:7-alpine
    command: >
      redis-server
      --maxmemory 256mb
      --maxmemory-policy noeviction
      --save ""
      --appendonly no
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-digitalfit}
      POSTGRES_USER: ${POSTGRES_USER:-digitalfit}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-digitalfit}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-digitalfit} -d ${POSTGRES_DB:-digitalfit}"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: docker/server.Dockerfile
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py runserver 0.0.0.0:8000"
    environment:
      DJANGO_DEBUG: ${DJANGO_DEBUG:-true}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-dev-insecure-key-nao-usar-em-producao}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,api,[::1]}
      SESSION_TOKEN_SECRET: ${SESSION_TOKEN_SECRET:-dev-token-secret}
      GATEWAY_WS_URL: ${GATEWAY_WS_URL:-ws://localhost:8001}
      POSTGRES_HOST: postgres
      POSTGRES_DB: ${POSTGRES_DB:-digitalfit}
      POSTGRES_USER: ${POSTGRES_USER:-digitalfit}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-digitalfit}
      REDIS_URL: redis://redis:6379/0
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      # Bind mount para reload automatico em desenvolvimento.
      - ./server:/app/server
      - ./workers:/app/workers
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz')
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  gateway:
    build:
      context: .
      dockerfile: docker/server.Dockerfile
    # ASGI (uvicorn): WebSocket de ingestão + push de feedback. O `api` segue em WSGI.
    command: uvicorn core.asgi:application --host 0.0.0.0 --port 8001
    environment:
      DJANGO_DEBUG: ${DJANGO_DEBUG:-true}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-dev-insecure-key-nao-usar-em-producao}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,gateway,[::1]}
      SESSION_TOKEN_SECRET: ${SESSION_TOKEN_SECRET:-dev-token-secret}
      GATEWAY_WS_URL: ${GATEWAY_WS_URL:-ws://localhost:8001}
      POSTGRES_HOST: postgres
      POSTGRES_DB: ${POSTGRES_DB:-digitalfit}
      POSTGRES_USER: ${POSTGRES_USER:-digitalfit}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-digitalfit}
      REDIS_URL: redis://redis:6379/0
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      - "${GATEWAY_PORT:-8001}:8001"
    volumes:
      - ./server:/app/server
      - ./workers:/app/workers
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  analysis-worker:
    build:
      context: .
      dockerfile: docker/server.Dockerfile
    working_dir: /app
    command: python -m workers.analysis_worker.main
    environment:
      REDIS_URL: redis://redis:6379/0
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - ./workers:/app/workers
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  report-builder:
    # SPEC-010: consome events.analysis e grava o SessionResult no Postgres. Roda como
    # comando do Django (e nao em workers/) porque e o unico consumidor que usa o ORM — ADR-008.
    build:
      context: .
      dockerfile: docker/server.Dockerfile
    command: python manage.py report_builder
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-dev-insecure-key-nao-usar-em-producao}
      POSTGRES_HOST: postgres
      POSTGRES_DB: ${POSTGRES_DB:-digitalfit}
      POSTGRES_USER: ${POSTGRES_USER:-digitalfit}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-digitalfit}
      REDIS_URL: redis://redis:6379/0
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - ./server:/app/server
      - ./workers:/app/workers
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    restart: unless-stopped

  dataset-writer:
    # SPEC-010: bufferiza pose.frames por sessao e grava dataset/{data}/{session_id}.parquet.
    # Imagem propria (pyarrow, ~100 MB) para nao engordar api/gateway/analysis.
    build:
      context: .
      dockerfile: docker/dataset-writer.Dockerfile
    working_dir: /app
    command: python -m workers.dataset_writer.main
    environment:
      REDIS_URL: redis://redis:6379/0
      DATASET_DIR: /data/dataset
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - ./workers:/app/workers
      # Bind mount e nao volume nomeado: o corpus existe para ser LIDO por notebook e por
      # script de treino, que rodam no host. Dentro de um volume ele so sairia por `docker cp`.
      - ./dataset:/data/dataset
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  pose-worker:
    # Modo cloud (SPEC-005): frames.raw -> MediaPipe CPU -> pose.frame.
    # Imagem propria (MediaPipe + OpenCV, ~250 MB) para nao engordar api/gateway/analysis.
    build:
      context: .
      dockerfile: docker/pose-worker.Dockerfile
    working_dir: /app
    command: python -m workers.pose_worker.main
    environment:
      REDIS_URL: redis://redis:6379/0
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DIGITALFIT_POSE_MODEL: /models/pose_landmarker_lite.task
    volumes:
      - ./workers:/app/workers
      # Mesmo `.task` do evalctl e do cliente web — paridade edge x cloud x bancada depende
      # de os tres carregarem literalmente o mesmo arquivo (SPEC-005, criterio 1).
      - ./eval/models:/models:ro
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  web:
    # Cliente Vite em modo dev. Imagem node crua + `npm install` no start: sem Dockerfile
    # proprio o `web` continua sendo "abra e mexa"; imagem de build e a T-027.
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5173"
    environment:
      # O cliente pede a sessao a API e usa o `ws_url` do ticket. Como o WS abre no
      # NAVEGADOR, as duas URLs sao as do host — nao os nomes de servico do compose.
      VITE_API_URL: ${VITE_API_URL:-http://localhost:${API_PORT:-8000}}
    ports:
      - "${WEB_PORT:-5173}:5173"
    volumes:
      - ./web:/app
      # `node_modules` em volume: binario nativo compilado no alpine nao serve no host.
      - web-node-modules:/app/node_modules
      # Mesmo modelo do worker/evalctl; sem isso o `npm run setup` baixaria 5,5 MB de novo.
      - ./eval/models:/models:ro
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres-data:
  web-node-modules:
