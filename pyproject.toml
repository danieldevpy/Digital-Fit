[project]
name = "digital-fit"
version = "0.1.0"
description = "Digital Fit — analise de exercicios por visao computacional (keypoint-first, event-driven)"
requires-python = ">=3.12"

# Dependencias do nucleo compartilhado (workers/shared): sem Django, sem web.
dependencies = [
    "msgpack>=1.1",
    "numpy>=2.1",
    "pyyaml>=6.0",
    # Fixado em 5.x: com redis-py 8 o `channels_redis` estoura `TimeoutError` na leitura
    # bloqueante do channel layer e mata o consumer do WebSocket (visto em teste real).
    "redis>=5.2,<6",
]

[project.optional-dependencies]
# Camada Django (api + gateway). Workers NUNCA importam isto.
server = [
    "channels>=4.2",
    "channels-redis>=4.2",
    "django>=5.1,<6.0",
    "djangorestframework>=3.15",
    # JWT de acesso/refresh da SPEC-011. A spec nomeia SimpleJWT; e a implementacao de fato
    # padrao do DRF e nao traz modelo proprio enquanto o blacklist ficar desligado.
    "djangorestframework-simplejwt>=5.3",
    "psycopg[binary]>=3.2",
    "uvicorn[standard]>=0.34",
    # Estáticos do painel (SPEC-018). O nginx da frente é o do operador e não é versionado
    # aqui (docs/DEPLOY.md), então servir CSS pelo processo é o que torna o painel utilizável
    # sem pedir uma mudança na máquina de quem faz deploy.
    "whitenoise>=6.8",
    # Servidor WSGI do `api` em producao. O gateway continua em uvicorn (ASGI): a divisao
    # WSGI/ASGI da ARCHITECTURE vale em producao tambem, nao so no compose de dev.
    "gunicorn>=23.0",
    "django-jazzmin>=3.0.5",
]

# Runtime de visao computacional do `pose-worker` (modo cloud, SPEC-005). Fica num extra
# proprio porque so UM servico paga por ele: a imagem do api/gateway/analysis-worker continua
# enxuta. O decoder JPEG e o mesmo da bancada (cv2) de proposito — decodificadores diferentes
# deslocariam os landmarks, e o teste de paridade da T-018 mediria a diferenca deles, nao a
# do pipeline.
pose = [
    "mediapipe>=0.10.14",
    "opencv-python-headless>=4.10",
]

# Runtime do `dataset-writer` (SPEC-010, T-021). Extra proprio pela mesma razao do `pose`:
# pyarrow pesa ~100 MB instalado e so um servico grava Parquet — api, gateway e
# analysis-worker nao tem o que fazer com ele.
dataset = [
    "pyarrow>=18.0",
]

# Bancada de avaliacao (SPEC-012): roda local, sem Docker. Mesmas dependencias do extra
# `pose` (e pela mesma razao: o modelo e o decoder tem de ser identicos aos do worker).
eval = [
    "mediapipe>=0.10.14",
    "opencv-python-headless>=4.10",
]

[dependency-groups]
dev = [
    # `channels.testing` importa daphne; so o teste precisa dele (o gateway sobe com uvicorn).
    "daphne>=4.1",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-django>=4.9",
    "ruff>=0.9",
    # Executa Lua de verdade: e o que torna o teste do semaforo (T-017) significativo.
    "fakeredis[lua]>=2.26",
    # O criterio 3 da SPEC-010 diz "legivel por pandas", entao o teste le com pandas de
    # verdade — pyarrow sozinho verificaria uma promessa mais fraca que a feita.
    "pandas>=2.2",
    "pyarrow>=18.0",
]

# Monorepo: nao ha pacote a construir, apenas pastas de servicos.
[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["web", "**/migrations"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # bugbear
    "SIM",  # simplify
    "RUF",
]
# Docstrings e comentarios sao em pt-BR: travessao e meia-risca sao tipografia, nao
# "unicode ambiguo". RUF001 (strings de codigo) fica ativo de proposito.
ignore = ["RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011"]
# RUF012 quer ClassVar em atributo de classe mutavel. No `class Meta` do Django isso e a
# forma documentada de declarar ordenacao e indices — anotar so para calar o lint deixaria o
# modelo diferente de todo exemplo de Django que alguem va consultar.
"server/api/models.py" = ["RUF012"]

[tool.pytest.ini_options]
# server/ no path para que `core.settings` e `api.*` sejam importaveis;
# raiz no path para `workers.*` e `eval.*`.
pythonpath = [".", "server"]
# `core.settings_test`, nao `core.settings`: e ele quem garante SQLite e cache em memoria ANTES
# de o Django ler a configuracao. A conftest nao consegue (T-076) — ver o modulo.
DJANGO_SETTINGS_MODULE = "core.settings_test"
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"
filterwarnings = [
    # O whitenoise avisa que `STATIC_ROOT` nao existe — verdade, e sem consequencia: quem roda
    # `collectstatic` e o build da imagem (docker/server.Dockerfile), e nenhum teste serve CSS.
    # Filtrado pelo texto exato para nao esconder outro aviso do mesmo tipo.
    "ignore:No directory at:UserWarning",
]
