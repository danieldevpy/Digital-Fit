# CI minima da Fase 0: lint + testes do lado Python.
# Build de imagens e lint do web: T-027.
#
# O gate de contagem (T-042) ja roda aqui dentro, sem passo proprio: `tests/test_corpus_regressao.py`
# le os keypoints versionados em `eval/fixtures/` e roda a FSM sobre gente real. Nao precisa do
# extra `eval` porque nao extrai pose nenhuma — a extracao ja aconteceu, uma vez, na maquina de
# quem gravou. O corpus completo (video -> MediaPipe -> FSM) continua manual, por falta dos
# videos no git.
name: ci

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # Sem o extra `eval` de proposito: MediaPipe/OpenCV pesam ~200 MB e os testes da
      # bancada rodam com extractor injetado — inclusive o gate de contagem, que le keypoints
      # ja extraidos.
      - name: Instalar dependencias
        run: uv sync --frozen --extra server

      - name: ruff
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: pytest
        run: uv run pytest
